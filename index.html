    const lines = ['WASD / Arrows — move        Shift — sprint (loud! limited stamina)', 'E or click — throw a decoy noise (6s cooldown): hunters investigate it', 'Collect 5 relay beacons, then reach the green extraction signal', 'Enemies see only inside their cone with line-of-sight, and hear sprinting.',
      'F1 debug view · K kinematic/steering · N A* nodes · H regions · T stress test · M mute · P pause · R restart'];
    lines.forEach((l, i) => this.text(ctx, l, V.w / 2, 230 + i * 28, 16, i === 4 ? '#ffb347' : '#e6ecff', 'center'));
    this.text(ctx, '"?" = suspicious (it heard or glimpsed you)     "!" = chasing you', V.w / 2, 400, 16, '#ffd24a', 'center');
    const k = 0.6 + 0.4 * Math.sin(performance.now() / 300); ctx.globalAlpha = k; this.text(ctx, 'Click or press Enter to start', V.w / 2, 500, 24, '#fff', 'center', true); ctx.globalAlpha = 1;
  }
}

/* =====================================================================
 *  Game loop — fixed 60 Hz timestep with accumulator, rendered every animation frame
 * ===================================================================== */
const canvas = document.getElementById('c'), input = new Input(canvas), game = new Game(canvas, input);
game.renderer = new Renderer(canvas); game.hud = new HUD(); game.debugOverlay = new DebugOverlay(game);
game.perf = { fps: 60, frame: 0, update: 0, render: 0 };
window.HUNTED = { game, CONFIG, god: false, Sfx };
window.game = game;                            // convenience for the headless tests
window.addEventListener('hunted-newmap', () => game.renderer.prerender(game));
game.renderer.prerender(game);

const bar = document.getElementById('bar');
const actions = {
  debug() { game.debug.on = !game.debug.on; },
  mode() { game.kinematic = !game.kinematic; },
  nodes() { game.debug.nodes = !game.debug.nodes; game.astar.traceOn = game.debug.nodes; if (game.debug.nodes) game.debug.on = true; },
  regions() { game.debug.regions = !game.debug.regions; if (game.debug.regions) game.debug.on = true; },
  stress() { game.addHunters(10); },
  mute() { Sfx.setMuted(!Sfx.muted); },
  pause() { if (game.mode === 'play') game.mode = 'paused'; else if (game.mode === 'paused') game.mode = 'play'; },
  restart() { game.startRun(); },
};
bar.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { Sfx.init(); actions[b.dataset.act](); canvas.focus(); } });
function syncButtons() {
  for (const b of bar.children) {
    const a = b.dataset.act; const on = (a === 'debug' && game.debug.on) || (a === 'nodes' && game.debug.nodes) || (a === 'regions' && game.debug.regions) || (a === 'mute' && Sfx.muted) || (a === 'pause' && game.mode === 'paused');
    b.classList.toggle('on', !!on);
    if (a === 'mode') b.textContent = 'Mode: ' + (game.kinematic ? 'Kinematic' : 'Steering') + ' (K)';
    if (a === 'mute') b.textContent = Sfx.muted ? 'Sound: OFF (M)' : 'Sound: on (M)';
  }
}
function handleKeys() {
  const k = (c) => input.consume(c);
  if (input.anyInput) { Sfx.init(); }
  if (k('F1')) actions.debug(); if (k('KeyK')) actions.mode(); if (k('KeyN')) actions.nodes(); if (k('KeyH')) actions.regions();
  if (k('KeyT')) actions.stress(); if (k('KeyM')) actions.mute(); if (k('KeyP')) actions.pause(); if (k('KeyR')) actions.restart();
  if (k('Enter') || k('Space')) { if (game.mode === 'title' || game.mode === 'dead') game.startRun(); }
  if (game.mode === 'title' && input.consumeClick()) game.startRun();
  if (game.mode === 'dead' && input.consumeClick()) game.startRun();
}
document.addEventListener('visibilitychange', () => { if (document.hidden && game.mode === 'play') game.mode = 'paused'; });

let last = performance.now(), acc = 0;
function frame(now) {
  const t0 = performance.now(), dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt;
  handleKeys();
  let steps = 0; const u0 = performance.now();
  while (acc >= CONFIG.step && steps < 5) { game.update(CONFIG.step); acc -= CONFIG.step; steps++; }
  if (steps === 5) acc = 0;
  const u1 = performance.now();
  if (game.mode === 'title') { game.hud.draw(game.renderer.ctx, game); }
  else { game.renderer.render(game, game.debugOverlay); game.hud.draw(game.renderer.ctx, game); }
  const t1 = performance.now(), P = game.perf, a = 0.05;
  P.update = lerp(P.update, u1 - u0, a); P.render = lerp(P.render, t1 - u1, a); P.frame = lerp(P.frame, t1 - t0, a); P.fps = lerp(P.fps, 1 / Math.max(dt, 0.001), 0.05);
  syncButtons(); input.endFrame();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
